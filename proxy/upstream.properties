# Where the protocol bridge's upstream code comes from.
#
# Every build resolves the base jar from exactly these values, so the bridge is
# reproducible from a checkout. upstream-refresh.yml bumps them automatically
# when upstream moves, and rebuild-base-jar.sh turns them into a jar.
#
#   viaproxy_*    the proxy itself (networking, accounts, CLI, realm plumbing),
#                 taken as a prebuilt CI artifact - nothing in it is patched at
#                 build time, so building it from source would only be slower.
#                 Jenkins keeps ~100 builds, so a pinned number eventually 404s;
#                 rebuild-base-jar.sh falls back to the latest build and says so.
#
#   viabedrock_*  the Java <-> Bedrock protocol translator that ViaProxy bundles.
#                 Built from source from our own fork, so protocol work we need
#                 can land without waiting on upstream - containers and item data
#                 are implemented there and nowhere else.
#
#                 Because this tracks the fork rather than RaphiMC/ViaBedrock,
#                 upstream fixes only arrive once the fork is synced. That is the
#                 trade for being able to ship translator changes at all.
#
#   viabedrock_fork_base
#                 the ViaBedrock commit that the forked sources under
#                 jarpatches/src/net/raphimc/viabedrock are currently merged
#                 against. merge-forks.sh uses it as the three-way merge base.
#                 It is not necessarily the commit being built.

viaproxy_ci=https://ci.viaversion.com/job/ViaProxy
viaproxy_build=915
viaproxy_artifact=build/libs/ViaProxy-3.4.13-SNAPSHOT.jar

viabedrock_repo=https://github.com/ethancroissants/ViaBedrock.git
viabedrock_ref=feature/inventories-and-containers
viabedrock_commit=0ffb7605328f8a6406f27d46007bbd2b4e1a7050
viabedrock_fork_base=0ffb7605328f8a6406f27d46007bbd2b4e1a7050
