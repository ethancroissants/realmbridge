name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.2 ships Java 25 class files, so the mod compiles on 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # A missing key renders as the raw "realmbridge.foo.bar" string in game,
      # which compiles and ships perfectly happily.
      - name: Check every translation key is defined
        working-directory: mod
        run: |
          python3 - <<'PY'
          import json, re, glob, sys
          lang = 'src/main/resources/assets/realmbridge/lang/en_us.json'
          keys = set(json.load(open(lang)))
          used = set()
          for f in glob.glob('src/main/java/**/*.java', recursive=True):
              used |= set(re.findall(r'translatable\(\s*"([^"]+)"', open(f).read()))
          missing = sorted(used - keys)
          unused = sorted(keys - used)
          for k in missing:
              print(f"::error::{k} is used in code but missing from {lang}")
          for k in unused:
              print(f"::warning::{k} is defined in {lang} but never used")
          sys.exit(1 if missing else 0)
          PY

      - name: Build
        working-directory: mod
        run: ./gradlew build --no-daemon

      - name: Check the jar is self-contained
        working-directory: mod
        run: |
          jar=$(ls build/libs/realmbridge-*.jar | grep -v sources | head -1)
          echo "Built $jar"
          # RealmBridge is meant to be dropped in next to fabric-api and nothing
          # else, so every non-Minecraft dependency has to be nested in the jar.
          for nested in MinecraftAuth httpclient gson; do
            unzip -l "$jar" | grep -q "META-INF/jars/$nested" \
              || { echo "::error::$nested is not bundled in $jar"; exit 1; }
          done
          unzip -l "$jar" | grep -q 'realmbridge.mixins.json' \
            || { echo "::error::mixin config missing from $jar"; exit 1; }
          unzip -l "$jar" | grep -q 'assets/realmbridge/lang/en_us.json' \
            || { echo "::error::language file missing from $jar"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: realmbridge-mod
          path: mod/build/libs/realmbridge-*.jar
          if-no-files-found: error

  bridge:
    name: Patched ViaProxy + plugin + CLI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The patch sources compile with --release 17 against the ViaProxy jar;
      # a modern JDK is fine and matches the mod job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Patch ViaProxy
        run: ./proxy/build-patched-jar.sh

      - name: Build ViaProxyPlus
        run: ./proxy/build.sh

      - name: Build the portable CLI bundle
        run: ./cli/make-dist.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$HOME/.bedrock-realm-bridge/ViaProxy.jar" dist/ViaProxy-patched.jar
          cp "$HOME/.bedrock-realm-bridge/plugins/ViaProxyPlus.jar" dist/
          cp cli/dist/bedrock-realm-bridge-*.tar.gz dist/bedrock-realm-bridge.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: realmbridge-bridge
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [mod, bridge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ViaProxyRunner downloads ViaProxy-patched.jar and ViaProxyPlus.jar from
      # the latest release, so both have to be attached under those exact names.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/realmbridge-mod/*.jar
            artifacts/realmbridge-bridge/*
          fail_on_unmatched_files: true
