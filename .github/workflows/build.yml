name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.2 ships Java 25 class files, so the mod compiles on 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # A missing key renders as the raw "realmbridge.foo.bar" string in game,
      # which compiles and ships perfectly happily.
      - name: Check every translation key is defined
        working-directory: mod
        run: |
          python3 - <<'PY'
          import json, re, glob, sys
          lang = 'src/main/resources/assets/realmbridge/lang/en_us.json'
          keys = set(json.load(open(lang)))
          used = set()
          for f in glob.glob('src/main/java/**/*.java', recursive=True):
              # Keys also reach Component.translatable through helper parameters,
              # so match any realmbridge-shaped literal rather than call sites.
              used |= set(re.findall(r'"(realmbridge\.[A-Za-z0-9_.]+)"', open(f).read()))
          missing = sorted(used - keys)
          unused = sorted(keys - used)
          for k in missing:
              print(f"::error::{k} is used in code but missing from {lang}")
          for k in unused:
              print(f"::warning::{k} is defined in {lang} but never used")
          sys.exit(1 if missing else 0)
          PY

      - name: Build
        working-directory: mod
        run: ./gradlew build --no-daemon

      - name: Check the jar is self-contained
        working-directory: mod
        run: |
          jar=$(ls build/libs/realmbridge-*.jar | grep -v sources | head -1)
          echo "Built $jar"
          # RealmBridge is meant to be dropped in next to fabric-api and nothing
          # else, so every non-Minecraft dependency has to be nested in the jar.
          for nested in MinecraftAuth httpclient gson; do
            unzip -l "$jar" | grep -q "META-INF/jars/$nested" \
              || { echo "::error::$nested is not bundled in $jar"; exit 1; }
          done
          unzip -l "$jar" | grep -q 'realmbridge.mixins.json' \
            || { echo "::error::mixin config missing from $jar"; exit 1; }
          unzip -l "$jar" | grep -q 'assets/realmbridge/lang/en_us.json' \
            || { echo "::error::language file missing from $jar"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: realmbridge-mod
          path: mod/build/libs/realmbridge-*.jar
          if-no-files-found: error

  bridge:
    name: Patched ViaProxy + plugin + CLI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The patch sources compile with --release 17, and this job also builds
      # ViaBedrock from source, which targets 17. 21 covers both.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The base jar is assembled from the upstream revisions pinned in
      # proxy/upstream.properties rather than committed, so it is cached against
      # those pins instead of being rebuilt on every run.
      - name: Cache the upstream base jar
        uses: actions/cache@v4
        with:
          path: proxy/jars/base.jar
          key: base-jar-${{ hashFiles('proxy/upstream.properties') }}

      - name: Build the base jar from pinned upstream
        run: ./proxy/rebuild-base-jar.sh

      - name: Patch ViaProxy
        run: ./proxy/build-patched-jar.sh

      - name: Build ViaProxyPlus
        run: ./proxy/build.sh

      # A jar can pass the patch step and still be broken: ViaBedrock spliced in
      # from source may not link against the ViaVersion the proxy bundles. That
      # only shows up when something actually starts the proxy.
      - name: Smoke test the patched bridge
        run: ./proxy/smoke-test.sh

      - name: Build the portable CLI bundle
        run: ./cli/make-dist.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$HOME/.bedrock-realm-bridge/ViaProxy.jar" dist/ViaProxy-patched.jar
          cp "$HOME/.bedrock-realm-bridge/plugins/ViaProxyPlus.jar" dist/
          cp cli/dist/bedrock-realm-bridge-*.tar.gz dist/bedrock-realm-bridge.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: realmbridge-bridge
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [mod, bridge]
    # Tag pushes and ordinary master pushes both publish. The version comes from
    # mod/gradle.properties, so bumping mod_version cuts a new release and
    # re-pushing without a bump just refreshes the current one's artifacts.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          v=$(grep -E '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [ -n "$v" ] || { echo "::error::mod_version missing from mod/gradle.properties"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing v$v"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ViaProxyRunner builds its download URLs by string concatenation, so the
      # asset names are load-bearing: rename one and the mod 404s at first launch
      # with no way to recover. Fail the release instead.
      - name: Check the bridge assets the mod downloads are present
        run: |
          missing=0
          for asset in ViaProxy-patched.jar ViaProxyPlus.jar; do
            if [ -f "artifacts/realmbridge-bridge/$asset" ]; then
              echo "ok: $asset ($(stat -c%s "artifacts/realmbridge-bridge/$asset") bytes)"
            else
              echo "::error::$asset missing - ViaProxyRunner downloads it by this exact name"
              missing=1
            fi
          done
          ls artifacts/realmbridge-mod/realmbridge-*.jar >/dev/null 2>&1 \
            || { echo "::error::no mod jar to publish"; missing=1; }
          exit $missing

      # releases/latest/download/ only ever resolves to a non-prerelease release,
      # hence make_latest.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: RealmBridge v${{ steps.version.outputs.value }}
          make_latest: true
          files: |
            artifacts/realmbridge-mod/*.jar
            artifacts/realmbridge-bridge/*
          fail_on_unmatched_files: true
